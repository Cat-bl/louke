# 编译检查：每次推送到分支、每个 Pull Request 都在 GitHub 上完整编译一遍（louke.dll、louke.exe、
# devtools\testlaunch.exe），编译不过就会标红。回放一致性要用真游戏测，见 devtools\regress.py。
name: 编译检查

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      LLVM_MINGW: llvm-mingw-20261104-ucrt-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: 下载编译器（llvm-mingw）
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$env:LLVM_MINGW.zip" -OutFile llvm-mingw.zip
          New-Item -ItemType Directory -Force tools | Out-Null
          tar -xf llvm-mingw.zip -C tools
          Remove-Item llvm-mingw.zip

      - name: 编译
        shell: cmd
        run: call build.bat
